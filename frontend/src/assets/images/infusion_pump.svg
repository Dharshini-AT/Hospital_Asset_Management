<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Soft Radial -->
  <rect width="400" height="400" rx="24" fill="#f1f5f9" />
  <circle cx="200" cy="200" r="140" fill="#e0f2fe" opacity="0.6" />

  <!-- IV Pole Clamp / Mount -->
  <rect x="70" y="40" width="14" height="320" rx="7" fill="url(#poleGrad)" />
  <rect x="60" y="140" width="34" height="20" rx="4" fill="#475569" />
  <rect x="60" y="240" width="34" height="20" rx="4" fill="#475569" />
  
  <!-- Device Handle -->
  <path d="M 130 90 L 130 60 Q 130 50 140 50 L 260 50 Q 270 50 270 60 L 270 90" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" />

  <!-- Main Device Body -->
  <g filter="url(#shadow)">
    <rect x="110" y="80" width="180" height="240" rx="20" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Accent Side Bar -->
    <path d="M 110 100 Q 110 80 130 80 L 140 80 L 140 320 L 130 320 Q 110 320 110 300 Z" fill="#0284c7" />

    <!-- Screen Bezel & Display -->
    <rect x="150" y="100" width="124" height="90" rx="10" fill="#0f172a" />
    <rect x="154" y="104" width="116" height="82" rx="8" fill="url(#screenGrad)" />
    
    <!-- Screen Elements -->
    <text x="162" y="122" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">INFUSION RATE</text>
    <text x="162" y="152" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff">125.0</text>
    <text x="232" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#bae6fd">mL/h</text>
    <rect x="162" y="164" width="100" height="12" rx="3" fill="#075985" />
    <text x="166" y="173" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#38bdf8">VOL INFUSED: 450 mL</text>

    <!-- Keypad / Control Buttons Grid -->
    <g transform="translate(150, 204)">
      <!-- Row 1 -->
      <circle cx="12" cy="12" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <circle cx="38" cy="12" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <circle cx="64" cy="12" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <rect x="84" y="4" width="32" height="16" rx="4" fill="#22c55e" />
      <text x="100" y="15" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">START</text>

      <!-- Row 2 -->
      <circle cx="12" cy="36" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <circle cx="38" cy="36" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <circle cx="64" cy="36" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <rect x="84" y="28" width="32" height="16" rx="4" fill="#ef4444" />
      <text x="100" y="39" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">STOP</text>

      <!-- Row 3 -->
      <circle cx="12" cy="60" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <circle cx="38" cy="60" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <circle cx="64" cy="60" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <rect x="84" y="52" width="32" height="16" rx="4" fill="#0284c7" />
      <text x="100" y="63" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">PURGE</text>
    </g>

    <!-- Peristaltic Pump Mechanism Channel -->
    <rect x="118" y="140" width="16" height="120" rx="4" fill="#334155" />
    <circle cx="126" cy="160" r="5" fill="#94a3b8" />
    <circle cx="126" cy="180" r="5" fill="#94a3b8" />
    <circle cx="126" cy="200" r="5" fill="#94a3b8" />
    <circle cx="126" cy="220" r="5" fill="#94a3b8" />
    <circle cx="126" cy="240" r="5" fill="#94a3b8" />

    <!-- Status LED -->
    <circle cx="160" cy="90" r="4" fill="#22c55e" />
    <circle cx="160" cy="90" r="7" fill="#22c55e" opacity="0.3" />
  </g>

  <!-- Tubing Line -->
  <path d="M 126 20 Q 126 100 126 140 L 126 260 Q 126 340 180 370" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
